  The Marketplace listing icon. Google's publishing guide asks for a 1:1 square at 128px or larger,
  with ~10% transparent padding, legible on BOTH the Light and Dark theme. The bare mark is not: its
  body is #f5f7fa, which is about 1.07:1 on a light card. So the mark sits on its own dark tile, inset
  12/128 (9.4%) to leave the transparent padding the guide asks for, and the card carries its own
  contrast on either theme instead of borrowing the host's.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Raffkin mark">
  <defs><linearGradient id="gold" x1="24" y1="24" x2="104" y2="104" gradientUnits="userSpaceOnUse"><stop stop-color="#ffd84a"/><stop offset="1" stop-color="#f2b705"/></linearGradient></defs>
  <rect x="12" y="12" width="104" height="104" rx="23" fill="#080a0d"/>
  <g transform="translate(22 26.3) scale(1.3125)">
    <path d="M32 1.5c1.6 6.9 5 10.3 11.9 11.9C37 15 33.6 18.4 32 25.3 30.4 18.4 27 15 20.1 13.4 27 11.8 30.4 8.4 32 1.5Z" fill="url(#gold)"/>
    <path d="M5 27 9.5 10.5 22 21 16 30Zm54 0-4.5-16.5L42 21l6 9Z" fill="url(#gold)"/>
    <path fill="#f5f7fa" fill-rule="evenodd" d="M3 31 15 20l14 4 3 7 3-7 14-4 12 11-6 16-17 4-6 10-6-10-17-4L3 31Zm9 2 7-5 7 2-3 9-8 1-3-7Zm40 0-7-5-7 2 3 9 8 1 3-7Z"/>
    <path d="m27 46 5 5 5-5-2.2-3h-5.6L27 46Z" fill="url(#gold)"/>
  </g>
</svg>
