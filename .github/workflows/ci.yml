name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Third-party actions are pinned to a commit SHA, with the release tag in a trailing comment.
# A mutable tag (@v4) can be repointed at new code by whoever controls the action's repo; a SHA
# cannot. The repository setting "Require actions to be pinned to a full-length commit SHA" is ON,
# so a bare tag is rejected at run time, and .github/dependabot.yml keeps the pins (and these
# comments) current weekly. (#131)
permissions:
  contents: read

jobs:
  invariants:
    name: Repo invariants (no inference)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Deterministic tests (invariants + bridge static + evals)
        # observra + typing_extensions are installed so the audit-log tests (real emit, privacy
        # invariant, rotation bounds) actually RUN here instead of importorskip-ping — otherwise a
        # rotation/emit regression would be invisible in CI.
        # keyring: the tenant registry's store, installed for the same reason -- the tests use an
        # in-memory backend, but the module imports the library, so without it they do not collect.
        # mcp/httpx/certifi: the bridge's own transport is tested against a local mock proxy
        # (tests/test_bridge_transport.py) on the same client line the lockfile pins; without them those
        # tests skip, and a skipped transport suite is how the 2026-09-06 failure mode would go unnoticed.
        run: uv run --with pytest --with jsonschema --with keyring --with observra --with typing_extensions --with "mcp>=1,<2" --with "httpx>=0.27,<1" --with certifi pytest -q tests/

      - name: Eval regression harness (recorded runs, no creds)
        # Grades the committed golden run against its fixture — schema, deterministic
        # checks, and the HARD safety gates (no gated write/close tool called, no
        # forbidden outcome). Default mode needs no MCP/credentials.
        run: uv run evals/run.py

      - name: Byte-compile the connector bridge
        run: python -m py_compile plugin/connector/exabeam-mcp-bridge.py

      - name: Guide is current with the docs sources (no drift)
        # guide/*.html and sitemap.xml are generated from plugin/docs/*.md by docs_build.py -- the public
        # copy of the install and guardrails docs. Gated like every other generated artifact.
        run: uv run docs_build.py --check

      - name: AI BOM is current with the sources
        # Fails if security/aibom.cdx.json drifts from plugin.json / .mcp.json /
        # connector deps / governance — regenerate with `uv run security/gen_aibom.py`.
        run: uv run security/gen_aibom.py --check

      - name: Identity artifacts are generated from plugin/identity.json (no drift)
        # Both host manifests and every permission rule are generated from identity.json +
        # permissions.json by plugin/gen_identity.py. A hand edit to a generated file would silently
        # split the plugin key from the namespace the gate matches on.
        run: python3 plugin/gen_identity.py --check

      - name: Codex approval map is generated from the permission snippet (no drift)
        run: uv run scripts/gen_codex_mcp.py --check

      - name: SBOM is current with the lockfile
        # Fails if security/sbom.cdx.json drifts from the bridge's uv lockfile — regenerate with
        # `uv run security/gen_sbom.py` (bump_version.py does it for you on a release).
        run: uv run security/gen_sbom.py --check

  mutation:
    name: Neutralizer mutation gate (deleting a rule must fail the suite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Each mutation of neutralize_output.py is killed by the tests (#120)
        # scripts/mutation_check.py removes one rule at a time in a scratch copy and runs the
        # neutralizer-facing tests there; a mutation the suite survives fails this job. Add a mutation
        # whenever you add a guard to the control (CONTRIBUTING, "Making a change").
        run: uv run --with pytest --with jsonschema --with keyring --with observra --with typing_extensions --with "mcp>=1,<2" --with "httpx>=0.27,<1" --with certifi scripts/mutation_check.py

  security:
    name: Security lint + dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Security lint — the shipped plugin (required)
        # ruff's flake8-bandit ruleset (S*) over the payload that lands on a user's machine. Every
        # deliberate exception is a `# noqa: S###` with its reason beside it — the rule is that a
        # swallowed exception in plugin/ is a documented decision, never an accident. (#100)
        # Pinned like the actions and the lockfile: a floating linter turns a required check red on an
        # unrelated PR the day a new S-rule ships. Bump by hand (Dependabot cannot see a --with pin).
        run: uv run --with ruff==0.16.6 ruff check --select S plugin/

      - name: Security lint — build-time code (advisory)
        # scripts/, security/, evals/ never ship (#66); tests/ are asserts by nature. Reported, not
        # gating, so a finding here is a code-quality signal rather than a broken build.
        run: uv run --with ruff==0.16.6 ruff check --select S --exit-zero --statistics scripts/ security/ evals/

      - name: Dependency audit — the bridge's locked tree (required)
        # The bridge's PEP 723 lockfile is hash-pinned (#71 rungs 1-2). This is rung 3: every locked
        # package that resolves on this runner's platform (Linux) checked against the OSV/PyPI advisory
        # databases on every push, so a dependency that becomes known-vulnerable is a red build, not a
        # surprise. The export keeps the lock's environment markers, so Windows-only entries (pywin32,
        # colorama) are not audited here — Dependabot alerts cover the whole tree asynchronously; this
        # is the synchronous gate.
        run: |
          uv export --script plugin/connector/exabeam-mcp-bridge.py --format requirements-txt --no-hashes -q > /tmp/bridge-requirements.txt
          uv run --with pip-audit==2.10.1 pip-audit -r /tmp/bridge-requirements.txt --strict --progress-spinner off

      - name: Build the SBOM from the lockfile
        # Regenerated on every run (not just committed) so the artifact below is always the tree that
        # was audited one step up, whatever the state of the checked-in copy.
        run: uv run security/gen_sbom.py

      - name: Publish the SBOM as a build artifact
        # CycloneDX 1.6 JSON + the HTML render, attached to this workflow run (90 days). Consumers who
        # want the SBOM for a given commit take it from here; the committed copy is the reviewed one.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: raffkin-sbom-${{ github.sha }}
          path: |
            security/sbom.cdx.json
            security/sbom.html
          retention-days: 90
          if-no-files-found: error
