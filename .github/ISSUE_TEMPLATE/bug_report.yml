name: Bug report
description: Something in Raffkin didn't work — install, investigation, guardrails, or docs.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >-
        Thanks for testing Raffkin. Two things before you file: **security problems**
        (gate bypass, token leakage, governance drift) go through a
        [private security advisory](https://github.com/open-agent-ai-security/socxen/security/advisories/new),
        not a public issue — see SECURITY.md. And since Raffkin works on SIEM data:
        **never paste real alert contents, usernames, hostnames, IPs, tokens, or credentials** —
        redact or substitute before posting.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: |
        1. Asked Raffkin to "investigate alert <id>"
        2. Expected it to pull the threat timeline
        3. Instead it ...
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: >-
        Paste the Raffkin line from `claude plugin list`, plus `claude --version` and your OS.
      placeholder: |
        raffkin@open-agent-ai-security Version: 0.6.5 Scope: user
        claude 2.1.220
        macOS 15.5
    validations:
      required: true
  - type: dropdown
    id: governance-gate
    attributes:
      label: Governance gate
      description: What does `preflight.sh` report for the human-in-the-loop gate? (It ships on.)
      options:
        - "ON — bundled hook (Claude Code) or tool-approval policy (Codex)"
        - "OFF or FAIL — preflight says so"
        - "Not checked"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: >-
        Installer output, error text, or the relevant part of the transcript.
        Remember to redact anything from a real tenant.
      render: text
    validations:
      required: false
